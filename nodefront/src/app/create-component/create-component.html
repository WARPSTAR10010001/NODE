<div class="create-container">
  <div class="type-selector">
    <h1>Neues Objekt erstellen</h1>
    <div class="selector-row">
      <label>Typ:</label>
      <select [(ngModel)]="entityType" (ngModelChange)="onTypeChange(entityType)">
        <option value="device">Gerät</option>
        <option value="category">Kategorie</option>
        <option value="status">Status</option>
        <option value="location">Standort</option>
        <option value="network-environment">Netzwerkumgebung</option>
      </select>
    </div>
    <hr>
  </div>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
    @if (entityType === 'device') {
    <div class="form-section-title">Gerätedaten</div>
    <div class="form-field">
      <label for="inventoryNumber">Inventarnummer *</label>
      <input id="inventoryNumber" formControlName="inventoryNumber" />
    </div>
    <div class="form-field">
      <label for="name">Name *</label>
      <input id="name" formControlName="name" />
    </div>
    <div class="form-field">
      <label for="manufacturer">Hersteller</label>
      <input id="manufacturer" formControlName="manufacturer" />
    </div>
    <div class="form-field">
      <label for="model">Modell</label>
      <input id="model" formControlName="model" />
    </div>
    <div class="form-field">
      <label for="serialNumber">Seriennummer</label>
      <input id="serialNumber" formControlName="serialNumber" />
    </div>
    <div class="form-field">
      <label for="categoryId">Kategorie *</label>
      <select id="categoryId" formControlName="categoryId">
        <option [ngValue]="null">Kategorie wählen</option>
        @for (c of categories; track c.id) {
        <option [ngValue]="c.id">{{ c.name }}</option>
        }
      </select>
    </div>
    <div class="form-field">
      <label for="statusId">Status *</label>
      <select id="statusId" formControlName="statusId">
        <option [ngValue]="null">Status wählen</option>
        @for (s of statuses; track s.id) {
        <option [ngValue]="s.id">{{ s.name }}</option>
        }
      </select>
    </div>
    <div class="form-field">
      <label for="purchase">Kaufdatum</label>
      <input id="purchase" formControlName="purchase" type="date" />
    </div>
    <div class="form-field">
      <label for="price">Preis</label>
      <input id="price" formControlName="price" type="number" />
    </div>
    <div class="form-field">
      <label for="supplier">Lieferant</label>
      <input id="supplier" formControlName="supplier" />
    </div>
    <div class="form-field">
      <label for="locationId">Standort</label>
      <select id="locationId" formControlName="locationId">
        <option [ngValue]="null">Kein Standort</option>
        @for (l of locations; track l.id) {
        <option [ngValue]="l.id">
          {{ l.city }} - {{ l.address }} {{ l.houseNumber }}
        </option>
        }
      </select>
    </div>
    <div class="form-field">
      <label for="networkEnvironmentId">Netzwerkumgebung</label>
      <select id="networkEnvironmentId" formControlName="networkEnvironmentId">
        <option [ngValue]="null">Keine</option>
        @for (n of networkEnvironments; track n.id) {
        <option [ngValue]="n.id">{{ n.name }}</option>
        }
      </select>
    </div>
    <div class="form-field full">
      <label for="notes">Notizen</label>
      <textarea id="notes" formControlName="notes" rows="3"></textarea>
    </div>
    }
    @if (entityType === 'category') {
    <div class="form-section-title">Kategorie</div>

    <div class="form-field">
      <label for="catName">Name *</label>
      <input id="catName" formControlName="name" />
    </div>
    <div class="form-field full">
      <label for="catDesc">Beschreibung</label>
      <textarea id="catDesc" formControlName="description" rows="3"></textarea>
    </div>
    }
    @if (entityType === 'status') {
    <div class="form-section-title">Status</div>
    <div class="form-field">
      <label for="statName">Name *</label>
      <input id="statName" formControlName="name" />
    </div>
    <div class="form-field full">
      <label for="statDesc">Beschreibung</label>
      <textarea id="statDesc" formControlName="description" rows="3"></textarea>
    </div>
    }
    @if (entityType === 'location') {
    <div class="form-section-title">Standort</div>
    <div class="form-field">
      <label for="city">Stadt *</label>
      <input id="city" formControlName="city" />
    </div>
    <div class="form-field">
      <label for="address">Adresse *</label>
      <input id="address" formControlName="address" />
    </div>
    <div class="form-field">
      <label for="houseNumber">Hausnummer</label>
      <input id="houseNumber" formControlName="houseNumber" />
    </div>
    <div class="form-field">
      <label for="room">Raum</label>
      <input id="room" formControlName="room" />
    </div>
    }
    @if (entityType === 'network-environment') {
    <div class="form-section-title">Netzwerkumgebung</div>

    <div class="form-field">
      <label for="envName">Name *</label>
      <input id="envName" formControlName="name" />
    </div>
    }
    <div class="form-actions">
      <button type="button" routerLink="/devices" class="danger">
        Abbrechen
      </button>
      <button type="submit" class="confirm" [disabled]="form.invalid || submitting">
        @if (submitting) { Speichere... } @else { Erstellen }
      </button>
    </div>
  </form>
</div>

<div id="cc">
    <div id="header">
        <a id="root-link" [routerLink]="['/']">
            <span id="node">NODE</span>
        </a>
        <div id="header-buttons">
            @if (auth.isLoggedIn()) {
            <button (click)="navigateLogin(true)">Abmelden</button>
            } @else {
            <button (click)="navigateLogin(false)">Anmelden</button>
            }
        </div>
    </div>
    <div id="main">
        <router-outlet></router-outlet>
    </div>
    <div id="footer">
        <a id="version" (click)="navigateChangelog()">{{ this.version.getVersion() }}</a>
    </div>
</div>

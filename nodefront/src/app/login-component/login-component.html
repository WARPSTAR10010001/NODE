<div class="cc">
  <div class="title">
    <hr>
    <h1>Anmeldung</h1>
  </div>

  <form (ngSubmit)="submit()" #f="ngForm">
    <label>
      Anmeldename (J-Nummer)
      <br>
      <input type="text" name="username" [(ngModel)]="username" autocomplete="username">
    </label>
    <br>
    <label>
      Passwort
      <br>
      <input type="password" name="password" [(ngModel)]="password" autocomplete="current-password">
    </label>
    <div class="button-row">
      <button class="primary" type="submit" [disabled]="loading || !f.valid">Anmelden</button>
    </div>
  </form>
</div>
